coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
http-server.http.port=8080
catalog.management=static
query.max-memory=512MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=256MB

# Clients use HTTPS with a password (password-authenticator.properties).
# Port 8080 stays inside the container for the health check and internal calls.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/secrets/keystore.jks
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
