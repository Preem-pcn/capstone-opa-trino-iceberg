<title>QAR Flight Analytics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: persistent navy sidebar + white topbar; light slate canvas with bordered cards; cockpit and SQL editor sit in dark instrument panels. Tokens follow the Figma stakeholder prototype. */
:root{
  --bg:#F1F5F8; --surface:#FFFFFF; --surface-2:#F4F7FA; --line:#DCE4EC; --line-2:#E9EEF3;
  --ink:#14263A; --ink-2:#4A5D72; --ink-3:#7A8A9C;
  --nav:#10233A; --nav-2:#1B3552; --nav-hover:#16304A; --nav-line:#2A4562; --nav-ink:#C9D6E3; --nav-ink-2:#8DA2B8; --nav-strong:#FFFFFF;
  --accent:#2E6DA4; --accent-hover:#275E8E; --accent-ink:#FFFFFF; --accent-soft:#E6F0F8; --accent-text:#2A6699;
  --teal:#178C87; --teal-bright:#5FD0C7; --teal-soft:#DDF1EE; --teal-text:#127A75;
  --amber:#C98A2E; --amber-soft:#FCEBD6; --amber-text:#A25B14;
  --red-soft:#FBE4E4; --red-text:#B4363A; --green-text:#1E7A45;
  --cockpit:#0F1E2D; --cockpit-2:#17314B; --cockpit-line:#24415E; --cockpit-ink:#E6EEF6; --cockpit-ink-2:#8FA6BD;
  --code-bg:#0F1D2A; --code-ink:#CBD7E3; --code-kw:#5FC6C0; --code-str:#E3B873; --code-num:#9CC7F0; --code-ln:#5A7088; --code-sel:#2A4A6B;
  --ph-go:#A3B4C4; --ph-cl:#85BCCB; --ph-cr:#3C8FB5; --ph-de:#C4A26C; --ph-gi:#8E9BB0; --ev:#A8692C;
  --sky:#3876A8; --ground:#8E6C48; --horizon:#F4F4F4; --wing:#F2C14E;
  --overlay:rgba(16,35,58,.12);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1621; --surface:#13212F; --surface-2:#172838; --line:#26394D; --line-2:#1E3043;
    --ink:#E3ECF4; --ink-2:#A6B8C9; --ink-3:#7C90A4;
    --nav:#09131D; --nav-2:#17304A; --nav-hover:#12263A; --nav-line:#1F364F;
    --accent:#4C8FC9; --accent-hover:#5C9DD6; --accent-ink:#06121D; --accent-soft:#183552; --accent-text:#93C3EC;
    --teal:#2BA59F; --teal-soft:#123B39; --teal-text:#72D5CD;
    --amber-soft:#3B2A14; --amber-text:#E9B36D; --red-soft:#3B1D21; --red-text:#F2908F; --green-text:#6CCB8F;
    --cockpit:#08131E; --cockpit-2:#132B42; --cockpit-line:#1F3B57;
    --code-bg:#08131E; --overlay:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1621; --surface:#13212F; --surface-2:#172838; --line:#26394D; --line-2:#1E3043;
  --ink:#E3ECF4; --ink-2:#A6B8C9; --ink-3:#7C90A4;
  --nav:#09131D; --nav-2:#17304A; --nav-hover:#12263A; --nav-line:#1F364F;
  --accent:#4C8FC9; --accent-hover:#5C9DD6; --accent-ink:#06121D; --accent-soft:#183552; --accent-text:#93C3EC;
  --teal:#2BA59F; --teal-soft:#123B39; --teal-text:#72D5CD;
  --amber-soft:#3B2A14; --amber-text:#E9B36D; --red-soft:#3B1D21; --red-text:#F2908F; --green-text:#6CCB8F;
  --cockpit:#08131E; --cockpit-2:#132B42; --cockpit-line:#1F3B57;
  --code-bg:#08131E; --overlay:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.num,.mono,td{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:26px 16px 26px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--nav-strong);font-weight:700;font-size:22px;letter-spacing:.01em;border:0;background:none;text-align:left}
.brand svg{flex:none}
.brand-sub{font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--nav-ink-2);padding:8px 12px 26px;margin:0 8px;border-bottom:1px solid var(--nav-line)}
.nav-label{font-size:10.5px;letter-spacing:.08em;color:var(--nav-ink-2);padding:26px 12px 14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:12px}
.nav button{display:flex;align-items:center;gap:16px;height:44px;padding:0 15px;border:0;background:transparent;color:var(--nav-ink);border-radius:6px;text-align:left;position:relative;font-size:13.5px;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--nav-hover)}
.nav button.on{background:var(--nav-2);color:var(--nav-strong);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:var(--teal-bright)}
.nav .ic{width:16px;display:inline-flex;justify-content:center;color:var(--nav-ink-2);font-size:14px}
.nav button.on .ic{color:var(--teal-bright)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:28px}
.side-foot .nav-label{padding:0 12px 4px}
.side-link{border:0;background:none;color:var(--nav-ink);text-align:left;font-size:12.5px;padding:6px 12px;border-radius:6px}
.side-link:hover{background:var(--nav-hover)}
.side-link.on{color:var(--nav-strong);background:var(--nav-2)}
.nav-chip{display:inline-flex;align-self:flex-start;background:var(--nav-2);color:var(--nav-strong);font-size:11px;font-weight:600;border-radius:999px;padding:7px 12px;margin:6px 4px 0}
.side-note{font-size:11.5px;color:var(--nav-ink-2);padding:2px 10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);min-height:72px;display:flex;align-items:center;gap:16px;padding-block:12px;padding-left:max(clamp(16px,2.6vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,1.8vw,24px),env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;min-width:0;flex:1;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;font-weight:600;color:var(--ink-2)}
.crumbs button:hover{color:var(--accent-text);text-decoration:underline}
.crumbs .sep{color:var(--ink-3);font-weight:400}
.top-right{display:flex;align-items:center;gap:18px;position:relative}
.utc{height:28px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:11.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center}
.idbtn{min-width:240px;height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 14px;font-size:13px;font-weight:500}
.idbtn b{font-weight:600}
.idbtn.alt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.content{width:100%;max-width:1180px;margin:0 auto;padding-block:34px 64px;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* ---------- menus & toasts ---------- */
.menu{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px var(--overlay);padding:6px;min-width:260px;display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;font-size:13px}
.menu button:hover,.menu button.on{background:var(--accent-soft)}
.menu button small{color:var(--ink-3);font-size:11.5px}
.menu .mhead{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--ink-3);padding:8px 10px 4px;text-transform:uppercase}
.toasts{position:fixed;z-index:60;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;padding:11px 14px;font-size:13px;box-shadow:0 10px 26px var(--overlay);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:16px}
.card-head h3{font-size:17px;font-weight:600}
.card-head .note{font-size:11.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.pill.sm{height:19px;font-size:10px;padding:0 9px}
.pill.teal{background:var(--teal-soft);color:var(--teal-text)}
.pill.amber{background:var(--amber-soft);color:var(--amber-text)}
.pill.red{background:var(--red-soft);color:var(--red-text)}
.pill.grey{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.btn{height:36px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.btn.soft:hover{border-color:var(--accent)}
.btn:disabled{background:var(--surface-2);color:var(--ink-3);border-color:transparent;cursor:not-allowed}
.btn.sm{height:30px;font-size:12px;padding:0 10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.split-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.split,.split-even{grid-template-columns:minmax(0,1fr)}}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;column-gap:10px;min-width:0}
.metric .lab{grid-column:1/-1;font-size:11.5px;color:var(--ink-2)}
.metric .val{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:8px}
.metric .unit{align-self:end;font-size:12px;color:var(--ink-3);padding-bottom:7px}
.metric .foot{grid-column:1/-1;font-size:10.5px;color:var(--ink-3);margin-top:4px}
.metric.up .lab{text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:10.5px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.state{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-2)}
.state h4{font-size:16px;color:var(--ink)}
.state.denied h4{color:var(--red-text)}
.redact{font-family:var(--f-mono);font-size:11.5px;color:var(--red-text);letter-spacing:.02em}

/* ---------- page heads ---------- */
.page-head{display:flex;justify-content:space-between;gap:16px 24px;align-items:flex-start;flex-wrap:wrap}
.page-head h1{font-size:28px;font-weight:700}
.page-head p{color:var(--ink-2);margin-top:8px;font-size:13.5px}
.rec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 24px;align-items:start}
.rec-head .title-row{display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;margin-top:12px}
.rec-head h1{font-size:40px;font-weight:700;font-family:var(--f-mono);letter-spacing:-.02em;line-height:1}
.rec-meta{font-size:15.5px;margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.rec-meta .bar{color:var(--ink-3)}
.rec-start{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:10px}
.actions{display:grid;grid-template-columns:auto auto;gap:9px 10px;justify-items:stretch}
.actions .btn{justify-content:flex-start}
.ctx-chip{display:flex;justify-content:flex-end}
@media (max-width:820px){.rec-head{grid-template-columns:minmax(0,1fr)}.actions{grid-template-columns:1fr 1fr}.rec-head h1{font-size:32px}}
.tabs{display:flex;gap:10px;padding:4px 8px;background:var(--surface);border-radius:8px;overflow-x:auto}
.tab{height:36px;min-width:140px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;text-align:left;font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}

/* ---------- explorer ---------- */
.search{display:flex;align-items:center;gap:14px;height:50px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 18px}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:14px;align-items:end}
@media (max-width:1000px){.filters{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.filters{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px;min-width:0;position:relative}
.field label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.select,.datebtn{height:39px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 34px 0 13px;font-size:13px;appearance:none;-webkit-appearance:none;text-align:left;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat;color:var(--ink)}
.datebtn{font-family:var(--f-ui)}
.select.set,.datebtn.set{border-color:var(--accent);background-color:var(--accent-soft)}
.datepop{top:70px;left:0;padding:14px;gap:12px;min-width:290px}
.datepop .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.datepop input{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface);min-width:0;width:100%}
.ftable{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:860px}
.ftable th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--ink-2);padding:12px 10px}
.ftable th:first-child{border-radius:6px 0 0 6px}.ftable th:last-child{border-radius:0 6px 6px 0}
.ftable td{padding:13px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;background:var(--surface);transition:background .12s}
.ftable td:first-child{border-left:1px solid var(--line);border-radius:6px 0 0 6px}
.ftable td:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0;text-align:right}
.ftable tr.frow{cursor:pointer}
.ftable tr.frow:hover td{background:var(--surface-2)}
.ftable tr.verified td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.fno{color:var(--accent-text);font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.route-mock{color:var(--ink-3)}

/* ---------- phase bar ---------- */
.pbar{position:relative;display:flex;height:26px;margin:14px 0}
.seg{height:100%;border:0;padding:0;flex:none;transition:opacity .15s,transform .15s;outline-offset:2px}
.seg + .seg{border-left:1px solid var(--surface)}
.seg:hover{filter:brightness(1.06)}
.seg.dim{opacity:.42}
.seg.sel{box-shadow:inset 0 0 0 2px var(--ink);}
.evmark{position:absolute;top:-10px;bottom:-8px;width:2px;background:var(--ev);transform:translateX(-1px);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 34px;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend button{border:0;background:none;padding:0;color:inherit;display:inline-flex;align-items:center;gap:7px;font-size:inherit}
.legend button.on{color:var(--accent-text);font-weight:600}
.pbar-labels{position:relative;height:16px;font-size:11px;color:var(--ink-2)}
.pbar-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pbar-labels span.on{color:var(--accent-text);font-weight:600}

/* ---------- tables ---------- */
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:left;background:var(--surface-2);color:var(--ink-2);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:8px 10px}
.dtable td{padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.dtable tr:last-child td{border-bottom:0}
.dtable td.mono{font-size:12.5px}
.dtable tr.click{cursor:pointer}
.dtable tr.click:hover td{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 22px;font-family:var(--f-mono);font-size:12px;align-items:baseline}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);word-break:break-all}
.kv .warn{color:var(--amber-text)}

/* ---------- chart ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}

/* ---------- cockpit ---------- */
.ck-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:start}
.ck-head h1{font-size:26px;font-weight:700}
.ck-sub{font-size:12px;color:var(--ink-2);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;text-transform:none}
.ck-time{display:flex;gap:10px 40px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.ck-time .utc-big{font-family:var(--f-mono);font-size:17px;font-weight:600}
.ck-time .off{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.ck-panel{background:var(--cockpit);border-radius:10px;padding:16px 20px 22px;color:var(--cockpit-ink)}
.ck-panel .ck-top{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.04em;color:var(--cockpit-ink-2);margin-bottom:14px;flex-wrap:wrap}
.ck-panel .ck-top b{font-weight:600;color:var(--cockpit-ink);letter-spacing:.06em}
.ck-grid{display:grid;grid-template-columns:minmax(220px,292px) minmax(0,1fr);gap:18px}
@media (max-width:760px){.ck-grid{grid-template-columns:minmax(0,1fr)}}
.horizon{background:var(--cockpit-2);border-radius:8px;padding:12px 14px;position:relative;display:flex;flex-direction:column;gap:4px}
.horizon .lbl{font-family:var(--f-mono);font-size:11px;color:var(--cockpit-ink)}
.horizon svg{width:100%;max-width:220px;margin:0 auto;display:block}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

function pad(n){ return String(n).padStart(2,'0'); }
function hms(s){ s=Math.max(0,Math.round(s)); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
function utc(off, full){ const d=new Date(START_TG0341 + Math.round(off)*1000);
  const t=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  return full ? `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${t} UTC` : t; }
const n0 = v => Number(v).toLocaleString('en-US');

function dLong(iso){ const [y,m,d]=iso.split('-'); return `${+d} ${MONTHS[+m-1]} ${y}`; }

/* ---------- illustrative (schematic) profiles — NOT recorded data ---------- */
function interp(pts, t){ if(t<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(t<=pts[i][0]){ const [t0,v0]=pts[i-1],[t1,v1]=pts[i]; return v0+(v1-v0)*(t-t0)/(t1-t0); } }
  return pts[pts.length-1][1]; }
const P_ALT=[[0,0],[5154,0],[6794,38000],[9000,39000],[10800,41000],[12000,42348],[14200,43036],[17500,43000],[19362,42900],[20600,9000],[21251,0],[22020,0]];
const P_GS=[[0,0],[500,12],[4900,14],[5154,165],[6794,470],[12000,501],[19362,492],[20900,180],[21251,138],[21600,22],[21900,10],[22020,0]];
const P_HDG=[[0,10],[5000,192],[6794,250],[12000,291.8],[19362,300],[21251,302],[22020,300]];
const P_PITCH=[[0,0],[5050,0],[5154,11],[5600,14],[6794,5],[6950,2.6],[12000,2.8125],[19300,2.6],[19500,-1.8],[21100,2.4],[21240,5.5],[21400,0],[22020,0]];
function illus(t){
  const roll = (t<6794||t>19362 ? 7 : 1.1)*Math.sin(t/430) * (t<4900||t>21300 ? 0.1 : 1);
  const vrtg = 1 + 0.015*Math.sin(t/37) + 0.277*Math.exp(-Math.pow((t-21251)/6,2)) + (t>5100&&t<5300 ? 0.08*Math.sin(t/9):0);
  return {alt:interp(P_ALT,t), gs:interp(P_GS,t), hdg:((interp(P_HDG,t)%360)+360)%360, pitch:interp(P_PITCH,t), roll, vrtg};
}
function valuesAt(t){ return {...illus(t), src:'demo'}; }

function policy(id, table){
  const open={allow:true, mask:[], deny:[], filter:null, pseudo:false};
  if(!table.includes('.opa_demo_')) return open;
  const fixOf = r => FIX.find(f=>f.flight_id===r.flight_id) || r;
  switch(id){
    case 'safety_analyst': return {...open, mask:['recording','source_file']};
    case 'operations_analyst': return {...open, mask:['tail','recording','source_file'], deny:['touchdown_peak_g'], pseudo:true,
      filter:r=>{ const f=fixOf(r); return f.origin==='VTBS'||f.destination==='VTBS'; }};
    case 'engineering_analyst': return {...open, mask:['flight_no','origin','destination'], filter:r=>fixOf(r).tail==='HS-THJ'};
    case 'blocked_user': return {...open, allow:false};
    default: return open;
  }
}
const MASK = {__mask:true};
function applyPolicy(id, table, rows){
  const p=policy(id,table);
  let out=rows.filter(r=>!p.filter||p.filter(r)).map(r=>{ const o={...r};
    p.mask.forEach(c=>{ if(c in o) o[c]=MASK; });
    if(p.pseudo && o.flight_id){ const f=FIX.find(x=>x.flight_id===r.flight_id); o.flight_id = f&&f.hash ? f.hash : 'sha256:unavailable'; }
    return o; });
  return {p, rows:out};
}

function resolveTable(name){

}

function runSql(text, identity){
  const clean=text.replace(/--[^\n]*/g,' ').replace(/\s+/g,' ').trim().replace(/;\s*$/,'');
  if(!clean) throw new SqlError('Query is empty. Write a SELECT or pick a saved example.');
  if(/;/.test(clean)) throw new SqlError('Run one statement at a time.');
  if(!/^select\b/i.test(clean)) throw new SqlError('Only read-only SELECT statements are allowed in this workspace.');
  const m=clean.match(/^select\s+(.+?)\s+from\s+([\w.]+)(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+(\w+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?$/i);
  if(!m) throw new SqlError('Prototype engine supports SELECT … FROM … [WHERE …] [ORDER BY col] [LIMIT n].');
  const tname=resolveTable(m[2]), T=TABLES[tname];
  const sel = m[1].trim()==='*' ? T.cols.slice() : m[1].split(',').map(s=>s.trim().toLowerCase());
  sel.forEach(c=>{ if(!T.cols.includes(c)) throw new SqlError(`Column '${c}' cannot be resolved`); });
  const conds = m[3] ? parseWhere(m[3], T.cols) : [];
  const ap = policy(identity, tname);
  if(!ap.allow) throw new SqlError(`${identity} is prohibited from querying ${tname.replace('iceberg.','')}`, 'den');
  const deniedCol = [...sel, ...conds.map(c=>c.c)].find(c=>ap.deny.includes(c));
  if(deniedCol) throw new SqlError(`${identity} cannot query ${deniedCol}`, 'den');
  let {rows}=applyPolicy(identity, tname, T.rows);
  rows=rows.filter(r=>conds.every(c=>test(r,c)));

    rows=rows.slice().sort((a,b)=>(a[oc]>b[oc]?1:a[oc]<b[oc]?-1:0)*dir); }
  if(m[6]) rows=rows.slice(0, +m[6]);
  return {table:tname, cols:sel, rows:rows.map(r=>sel.map(c=>r[c])), masked:ap.mask.filter(c=>sel.includes(c)), pseudo:ap.pseudo && sel.includes('flight_id')};
}
function highlight(src){
  const re=/(--[^\n]*)|('(?:[^'\n])*'?)|(\b\d+(?:\.\d+)?\b)|(\b(?:SELECT|FROM|WHERE|AND|OR|ORDER|BY|LIMIT|BETWEEN|AS|ASC|DESC|LIKE|IN|NOT|NULL|IS|GROUP|HAVING|JOIN|ON|COUNT|DISTINCT)\b)/gi;
  let out='', last=0, m;
  while((m=re.exec(src))){ out+=esc(src.slice(last,m.index));
    const cls = m[1]?'hl-com':m[2]?'hl-str':m[3]?'hl-num':'hl-kw';
    out+=`<span class="${cls}">${esc(m[0])}</span>`; last=re.lastIndex; }
  return out+esc(src.slice(last))+'\n';
}

function catalogTree(){

  let h=`<button class="lv0" data-act="tree" data-k="iceberg">${car('iceberg')}iceberg</button>`;
  if(!open('iceberg')) return h;

    const sk='iceberg.'+sch;
    const vis=tbs.filter(tb=>!q || tb.includes(q) || sch.includes(q) || TABLES[sk+'.'+tb].cols.some(c=>c.includes(q)));

}

  const seA=byApt.filter(x=>x.ni).map(x=>({k:x.k,sub:x.sub,a:x.se*100,n:x.ni,c:'--teal'})).sort((p,q)=>q.a-p.a);
  const c2=`<section class="card"><div class="card-head"><h3>② Single-engine taxi-in by airport</h3><span class="note">% of taxi-in time on one engine · click an airport</span></div>
    ${gBars(seA,{max:100,fmt:f1,act:'gold-pick',key:'apt',unit:'%'})}
    <p class="gfoot">Use case: single-engine taxi time · from Silver N2 / engine-run discretes per engine during the taxi_in segment</p></section>`;
  // ③ landing fuel by type
  const fk=g.fuel==='f5'?'f5':'land';
  const byT=G_TYPES.map(t=>{ const r=ok.filter(f=>f.type===t); return {k:t, a:avg(r.map(f=>f[fk])), n:r.length, lo:Math.min(...r.map(f=>f[fk])), hi:Math.max(...r.map(f=>f[fk]))}; }).filter(x=>x.n);
  const c3=`<section class="card"><div class="card-head"><h3>③ Fuel used near landing, by aircraft type</h3>
      <div class="seg2" role="group" aria-label="Segment"><button class="${fk==='land'?'on':''}" data-act="gold-fuel" data-v="land">Landing</button><button class="${fk==='f5'?'on':''}" data-act="gold-fuel" data-v="f5">Final 5,000 ft</button></div></div>
    ${gBars(byT.map(x=>({...x,sub:`range ${f0(x.lo)}–${f0(x.hi)} kg`,c:'--ph-de'})),{max:Math.max(...byT.map(x=>x.a)),fmt:f0,act:'gold-pick',key:'type',unit:'kg'})}
    <p class="gfoot">Use cases: fuel during landing · final 5,000 ft before landing. Mean of Σ(ff_1+ff_2)·dt over the segment. Height is above the landing runway, not raw pressure altitude.</p></section>`;
  // ④ planned vs actual
  const byR=G_ROUTES.map(rt=>{ const r=ok.filter(f=>f.org===rt.org&&f.dst===rt.dst); return {rt,n:r.length,act:avg(r.map(f=>f.trip))}; }).filter(x=>x.n);
  const c4=`<section class="card"><div class="card-head"><h3>④ Planned vs actual fuel by route</h3><span class="pill amber">Planned fuel · not connected</span></div>
    <div class="scroll-x"><table class="dtable"><thead><tr><th>Route</th><th style="text-align:right">Flights</th><th style="text-align:right">Actual trip fuel (QAR)</th><th style="text-align:right">Planned (OFP)</th><th style="text-align:right">Difference</th></tr></thead><tbody>
    ${byR.map(x=>`<tr class="click" data-act="gold-pick" data-k="route" data-v="${x.rt.org}-${x.rt.dst}"><td class="mono">${x.rt.org} → ${x.rt.dst}</td><td class="mono" style="text-align:right">${x.n}</td><td class="mono" style="text-align:right">${f1(x.act)} t</td><td class="mono muted" style="text-align:right">—</td><td class="mono muted" style="text-align:right">—</td></tr>`).join('')}</tbody></table></div>
    <p class="gfoot">Planned fuel lives in the flight-plan system, not in QAR. Showing it needs a cross-system join — input to the open Athena vs Trino decision.</p></section>`;
  // ⑤ flights table
  const pk=g.pick, list=(pk?ok.filter(f=>pk.k==='apt'?(f.org===pk.v||f.dst===pk.v):pk.k==='type'?f.type===pk.v:`${f.org}-${f.dst}`===pk.v):rows)
    .slice().sort((p,q)=>pk&&pk.k==='type'?(q[fk]||0)-(p[fk]||0):(q.tOut||0)-(p.tOut||0));
  const pickLabel=pk?(pk.k==='apt'?`Airport ${pk.v} · ${G_APT[pk.v]}`:pk.k==='type'?`Aircraft ${pk.v} · sorted by ${fk==='f5'?'final 5,000 ft':'landing'} fuel`:`Route ${pk.v.replace('-',' → ')}`):'All flights in filter · sorted by taxi-out';
  const c5=`<section class="card" id="g-table"><div class="card-head"><h3>⑤ Flights</h3>
      <span class="row" style="gap:8px"><span class="pill">${pickLabel}</span>${pk?`<button class="btn sm" data-act="gold-unpick">Clear</button>`:''}</span></div>
    <div class="scroll-x"><table class="dtable"><thead><tr><th>Flight</th><th>Date</th><th>Type</th><th>Route</th><th style="text-align:right">Taxi-out</th><th style="text-align:right">Taxi-in</th><th style="text-align:right">1-eng taxi-in</th><th style="text-align:right">Landing fuel</th><th style="text-align:right">Final 5,000 ft</th><th>Data</th><th></th></tr></thead><tbody>
    ${list.slice(0,12).map(f=>`<tr class="click" data-act="gold-open" data-no="${f.no}" tabindex="0"><td class="mono">${f.no}</td><td class="mono muted">${f.date}</td><td>${f.type}</td><td class="mono">${f.org} → ${f.dst}</td>
      <td class="mono" style="text-align:right">${f1(f.tOut)} min</td><td class="mono" style="text-align:right">${f1(f.tIn)} min</td><td class="mono" style="text-align:right">${f.se==null?'—':f1(f.se*100)+' %'}</td>
      <td class="mono" style="text-align:right">${f0(f.land)} kg</td><td class="mono" style="text-align:right">${f0(f.f5)} kg</td>
      <td>${f.verified?'<span class="pill sm teal">Verified phases</span>':f.excl?`<span class="pill sm amber" title="${esc(f.excl)}">Excluded</span>`:'<span class="pill sm grey">Illustrative</span>'}</td>
      <td style="text-align:right" class="small"><span style="color:var(--accent-text)">Open flight →</span></td></tr>`).join('')}</tbody></table></div>
    <p class="gfoot">${list.length} flights · first 12 shown. Open flight → Flight Detail zoomed to the matching segment (taxi_out, taxi_in or landing).</p></section>`;
  const defs=`<details class="card gdefs"><summary><b>Segment definitions used on this page</b> <span class="muted small">· draft rules, to confirm with the airline</span></summary>
    <dl class="kv" style="margin-top:12px"><dt>taxi_out</dt><dd>first movement (GS &gt; 5 kt) → start of takeoff roll</dd><dt>taxi_in</dt><dd>runway exit → aircraft stops / engines off</dd>
    <dt>single-engine</dt><dd>one engine below run threshold (N2 / run discrete) while in taxi segment</dd><dt>landing</dt><dd>1,000 ft above runway → runway exit</dd>
    <dt>final_5000ft</dt><dd>last crossing of 5,000 ft above landing runway → touchdown</dd><dt>fuel used</dt><dd>Σ (ff_1 + ff_2) · dt over the segment; segments with fuel-flow gaps are excluded</dd></dl></details>`;
  return head()+filters+kpis+`<div class="split-even">${c1}${c2}${c3}${c4}</div>`+c5+defs;
  function head(){ return `<div class="page-head"><div><h1>Fleet reports</h1><p>Gold metrics across many flights · find where to look, then open a flight to see why</p></div>
    <div class="row"><span class="pill grey">Illustrative fleet data</span><button class="btn primary" data-act="metabase">Open in Metabase ↗</button></div></div>`; }
}
function gk(lab,val,unit,foot,warn){ return `<div class="metric gk ${warn?'warnk':''}"><div class="lab">${lab}</div><div class="val">${val}<span class="u">${unit}</span></div><div class="foot">${foot}</div></div>`; }

function vFixtures(){
  const id=S.identity;

    operations_analyst:'Only routes involving VTBS (2 rows); tail, recording, source_file masked; touchdown_peak_g denied.',
    engineering_analyst:'Only tail HS-THJ (1 row); flight_no, origin, destination masked.', blocked_user:'Fixture queries denied. Frontend hiding alone is not authorization.'};
  const SENS={admin:()=>`<span class="small muted">Original</span>`, safety_analyst:()=>`<span class="redact">recording: REDACTED</span>`,
    operations_analyst:()=>`<span class="redact">source_file: REDACTED</span>`, engineering_analyst:()=>`<span class="redact">route: REDACTED</span>`};

  } else {
    const {rows}=applyPolicy(id,'iceberg.opa_demo_silver.flights',TABLES['iceberg.opa_demo_silver.flights'].rows);

      <div class="scroll-x"><table class="dtable" style="min-width:720px"><thead><tr><th>flight_id</th><th>Tail</th><th>Route</th><th>flight_no</th><th>Sensitive fields</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="mono" ${r.flight_id.length>40?`title="${r.flight_id}"`:''}>${r.flight_id.length>40?r.flight_id.slice(0,21)+'…':esc(r.flight_id)}</td><td class="mono">${show(r.tail)}</td>
        <td class="mono">${r.origin===MASK?show(MASK):esc(r.origin)+' → '+esc(r.destination)}</td><td class="mono">${show(r.flight_no)}</td><td>${SENS[id]()}</td></tr>`).join('')}
      </tbody></table></div>
      ${id==='operations_analyst'?`<p class="small muted" style="margin-top:16px">Flight IDs displayed as truncated SHA-256 pseudonyms; hover a row to see the full stable hash.</p>`:''}`;

  <section class="card"><div class="card-head"><h3>OPA demonstration · server-enforced access control</h3></div>
    <div class="row" style="justify-content:space-between"><p style="color:var(--ink-2)">${NOTE[id]}</p>
      <div class="row"><button class="btn" data-act="sql-load" data-q="fix" data-run="1">Run fixture query as ${id}</button>
      ${id==='operations_analyst'?`<button class="btn primary" data-act="sql-load" data-q="denied" data-run="1">Run denied SQL example →</button>`:''}</div></div></section>`;
}

      ${sec('2 / Flight &amp; instrument decisions',['Phase boundaries are inclusive; widths proportional to 5,154 / 1,640 / 12,568 / 1,890 / 768 s.','Events: liftoff 5154, top_of_climb 6794, top_of_descent 19362, touchdown 21251.','Altitude: <code>rate_1hz.alt_std</code> 42,348 ft. GS: <code>rate_4hz.gs</code> 501.0 kts. Heading raw −68.2031444°, normalized 291.8°.','Pitch: <code>rate_4hz.pitch_ang_cap</code> +2.8125008°. Roll: <code>rate_4hz.rollangle_cpt</code> +0.1757813°.','Acceleration: <code>rate_8hz.vrtg</code> 0.99609375 g instantaneous; touchdown peak 1.277 g derived, distinct.','IAS <code>rate_1hz.ias</code> 244 with unit unverified. All charts without history are schematic. Missing samples should be gaps.','Cockpit instruments are reusable shapes; no third-party cockpit library selected.'])}
      ${sec('3 / Query, BI &amp; permissions',['Existing POC SQL uses iceberg Silver at 0.25 / 0.5 / 1 / 2 / 4 / 7 / 8 Hz; uploaded B777 source also has 5 / 10 Hz, not confirmed ingested.','Trino query execution, result statuses, query history and speed control are prototype-only interactions.','Metabase handoff and dashboard filters are proposed; only one verified Gold flight represented.','OPA fixtures are separate mock data. Counts 3/2/1 apply only to fixture identities, not inventory.','OPA operations_analyst stable SHA-256 (hex) fixture ID 1: <code>45c43228c3b55d0b1e756b232328e8a5bc564e6f5b4f4760d491e10c11ef75aa</code>','Fixture ID 2: <code>6b2d528fac0d1077c465889bd9b1c1d5a3f4993ddbf45eeabef9b4ef57a603db</code>','Masking means REDACTED; denial means unavailable, never 0. This prototype does not enforce authorization.'])}
      ${sec('4 / Questions for airline stakeholders',['What are the primary investigation scenarios, user personas, and preferred search criteria?','Which phase, event and quality definitions should receive operational sign-off?','Should playback default to native samples, hold-last, or explicitly selected resampling?','Which parameters and units should be shown by default in the cockpit?','Which departments need SQL vs. curated reports, and what roles can view each parameter?','What metadata, provenance, and data-quality messages are required for auditability?'])}
    </section>

      <p class="small" style="color:var(--red-text)">no verified Gold metrics, no sample cockpit values</p>

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function render(){
  renderSide(); renderTop();
  const V={explorer:vExplorer, flight:vFlight, cockpit:vCockpit, sql:vSql, gold:vGold, fixtures:vFixtures, notes:vNotes, sitemap:vSitemap}[S.page]||vExplorer;
  $('#view').innerHTML=V();
  if(S.page==='sql') setupEditor();
  if(S.page==='cockpit') updCk();
  store.set('qar.identity', S.identity);
}

document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]');
  if(!a){ if(S.menu && !e.target.closest('.menu')){ S.menu=null; render(); } return; }
  const d=a.dataset;
  switch(d.act){
    case 'nav': go(d.page, d.page==='cockpit'?{ck:{...S.ck, pending:null}}:d.page==='flight'?{flight:'TG0341', tab:d.tab||'overview'}:{}); break;
    case 'menu': S.menu = S.menu===d.menu ? null : d.menu; render(); break;
    case 'menu-close': S.menu=null; render(); break;
    case 'identity': S.identity=d.id; S.menu=null; render(); toast(`Demo identity: ${d.id} · applies to OPA fixture queries`); break;
    case 'open-flight': e.stopPropagation(); openFlight(d.no); break;
    case 'clear-filters': S.f={q:'',from:'2022-01-01',to:'2022-12-31',type:'',org:'',dst:''}; S.menu=null; render(); break;
    case 'date-apply': { const f=$('#d-from').value, t=$('#d-to').value;
      if(f && t && f>t){ toast('Start date must be on or before the end date.'); return; }
      S.f.from=f; S.f.to=t; S.menu=null; render(); break; }
    case 'tab': S.tab=d.tab; render(); break;
    case 'phase': S.phase=d.phase; if(S.page==='flight') S.tab='phases'; render(); break;
    case 'interval-cockpit': go('cockpit', {ck:{...S.ck, flight:'TG0341', pending:S.phase}}); break;
    case 'interval-sql': { const p=phaseBy(S.phase); loadSql(`SELECT ts, t_offset_s, alt_std, ias\nFROM iceberg.silver.rate_1hz\nWHERE flight_id = '${TID}'\n  AND t_offset_s BETWEEN ${p.s} AND ${p.e}\nORDER BY t_offset_s\nLIMIT 100;`, true); break; }
    case 'open-cockpit': go('cockpit', {ck:{...S.ck, flight:'TG0341', t:0, pending:null}}); break;
    case 'seek-event': go('cockpit', {ck:{...S.ck, flight:'TG0341', t:+d.t, pending:null}}); break;
    case 'ck-flight': S.ck.flight=d.no; S.ck.t=0; S.ck.pending=null; render(); break;
    case 'ck-pending': S.ck.pending=d.phase; render(); break;
    case 'ck-start': S.ck.pending=null; S.ck.t=+d.t; if($('#ck-seek')) updCk(); else render(); break;
    case 'ck-phase': seek(phaseBy(d.phase).s); break;
    case 'ck-play': S.ck.playing ? pause() : play(); break;
    case 'ck-step': if(S.ck.playing) pause(); seek(Math.round(S.ck.t)+(+d.d)); break;
    case 'ck-speed': S.ck.speed=+d.s; document.querySelectorAll('.speed').forEach(b=>{ const on=+b.dataset.s===S.ck.speed; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }); break;
    case 'sql-run': sqlRun(); break;
    case 'sql-cancel': sqlCancel(); break;
    case 'sql-load': { const q=SAVED.find(x=>x.k===d.q); if(q) loadSql(q.sql, !!d.run);
      else if(d.q==='flights') loadSql(`SELECT flight_id, tail, aircraft_type, recording_start, duration_s\nFROM iceberg.silver.flights\nORDER BY recording_start;`, !!d.run); break; }
    case 'sql-table': loadSql(`SELECT *\nFROM ${d.table}\nWHERE flight_id = '${TID}'\nLIMIT 100;`, true); break;
    case 'tree': S.tree.has(d.k)?S.tree.delete(d.k):S.tree.add(d.k); $('#tree').innerHTML=catalogTree(); break;
    case 'tree-table': {
      if(e.detail>=2){ loadSql(`SELECT *\nFROM ${d.k}\nLIMIT 100;`, true); break; }
      const ta=$('#sql-ta'); if(e.target.classList.contains('car')){ S.tree.has(d.k)?S.tree.delete(d.k):S.tree.add(d.k); $('#tree').innerHTML=catalogTree(); }
      else if(ta) insertAt(ta, d.k); break; }
    case 'insert': { const ta=$('#sql-ta'); if(ta) insertAt(ta, d.v); break; }
    case 'hist': { const h=S.sql.history[+d.i]; S.sql.text=h.sql; render(); break; }
    case 'hist-clear': S.sql.history=[]; render(); break;
    case 'gold-set': S.gold[d.k]=d.v; S.menu=null; render(); break;
    case 'gold-reset': S.gold={range:'FY',type:'',apt:'',pick:null,fuel:'land'}; S.menu=null; render(); break;
    case 'gold-pick': S.gold.pick={k:d.k, v:d.v}; render(); { const t=$('#g-table'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); } break;
    case 'gold-unpick': S.gold.pick=null; render(); break;
    case 'gold-fuel': S.gold.fuel=d.v; if(S.gold.pick&&S.gold.pick.k==='type'){} render(); break;
    case 'gold-open': if(d.no==='TG0341'){ S.flight='TG0341'; go('flight',{tab:'phases', phase:'ground_out'}); toast('Opened TG0341 · taxi segment rules are not run in the POC, so Ground Out is shown.'); }
      else toast(`${d.no} is an illustrative fleet row. In the real app this opens its Flight Detail zoomed to the matching segment.`); break;
    case 'gold-phase': S.flight='TG0341'; S.phase=d.phase; go('flight',{tab:'phases'}); break;
    case 'metabase': toast('Metabase handoff is proposed · not connected in this prototype.'); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.menu){ S.menu=null; render(); return; }
  const row=e.target.closest && e.target.closest('tr[data-act]');
  if(row && (e.key==='Enter'||e.key===' ') && e.target===row){ e.preventDefault(); row.click(); return; }
  if(S.page==='cockpit' && !S.ck.pending && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')){
    if(e.key===' '){ e.preventDefault(); S.ck.playing?pause():play(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); seek(Math.round(S.ck.t)+(e.shiftKey?60:1)); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); seek(Math.round(S.ck.t)-(e.shiftKey?60:1)); }
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='f-q'){ S.f.q=t.value; $('#ex-rows').innerHTML=explorerRows(); }
  else if(t.id==='ck-seek'){ if(S.ck.playing) pause(); S.ck.t=+t.value; updCk(); }
  else if(t.id==='cat-q'){ S.catq=t.value; $('#tree').innerHTML=catalogTree(); }
});
document.addEventListener('change', e=>{
  const t=e.target, map={'f-type':'type','f-org':'org','f-dst':'dst'};
  if(map[t.id]){ S.f[map[t.id]]=t.value; t.classList.toggle('set',!!t.value); $('#ex-rows').innerHTML=explorerRows(); }
  else if(t.id==='ck-flight'){ if(S.ck.playing) pause(); S.ck.flight=t.value; S.ck.t=0; S.ck.pending=null; render(); }
  else if(t.id==='g-range'||t.id==='g-type'||t.id==='g-apt'){ S.gold[{'g-range':'range','g-type':'type','g-apt':'apt'}[t.id]]=t.value; S.gold.pick=null; render(); }
});

/* boot */
(function(){
  const saved=store.get('qar.identity'); if(IDENTITIES.some(i=>i.k===saved)) S.identity=saved;
  const h=(location.hash||'').slice(1); if(PAGES[h] && h!=='flight') S.page=h;
  render();
})();
</script>
