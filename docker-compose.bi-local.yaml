# Isolated local stack for this checkout. Does not merge with docker-compose.yaml.
# Run scripts/init_bi_secrets.py first (start_bi_demo.ps1 does): it creates the .secrets/ files used below.
# A separate project name keeps the older, password-less qar-capstone-bi stack and its volumes untouched.
name: qar-capstone-sso
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes: ["rustfs_data:/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 30
      start_period: 10s
  create-bucket:
    image: amazon/aws-cli:2.36.40
    depends_on:
      rustfs: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["aws s3api head-bucket --bucket warehouse 2>/dev/null || aws s3 mb s3://warehouse"]
  catalog-init:
    image: apache/iceberg-rest-fixture:1.10.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /catalog"]
    volumes: ["catalog_data:/catalog"]
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      create-bucket: {condition: service_completed_successfully}
      catalog-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:9181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:/catalog/iceberg_catalog.db
      JAVA_TOOL_OPTIONS: -Xmx256m
    volumes: ["catalog_data:/catalog"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config >/dev/null"]
      interval: 5s
      retries: 30
      start_period: 10s
  opa:
    image: openpolicyagent/opa:1.0.1-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policies/trino.rego"]
    volumes: ["./opa:/policies:ro"]
    ports: ["127.0.0.1:9282:8181"]
    mem_limit: 128m
  # One-shot job: self-signed TLS certificate for Trino. The keystore stays private;
  # trino-public/trino.crt is what clients trust.
  trino-tls:
    image: trinodb/trino:483
    env_file: [.secrets/trino.env]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        test -f /tls/keystore.jks || keytool -genkeypair -noprompt -alias trino -keyalg RSA -keysize 2048
        -validity 825 -dname CN=trino -ext SAN=dns:trino,dns:localhost,ip:127.0.0.1
        -storetype JKS -keystore /tls/keystore.jks -storepass "$$TRINO_KEYSTORE_PASSWORD";
        keytool -exportcert -rfc -alias trino -keystore /tls/keystore.jks
        -storepass "$$TRINO_KEYSTORE_PASSWORD" -file /public/trino.crt
    volumes:
      - ./.secrets/trino:/tls
      - ./.secrets/trino-public:/public
  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest: {condition: service_healthy}
      opa: {condition: service_started}
      trino-tls: {condition: service_completed_successfully}
    # HTTPS only on the host; the plain HTTP port is not published.
    ports: ["127.0.0.1:8443:8443"]
    env_file: [.secrets/trino.env]
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./bi/trino/config.properties:/etc/trino/config.properties:ro
      - ./bi/trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./bi/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./.secrets/trino:/etc/trino/secrets:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 5s
      retries: 60
      start_period: 30s
  metabase:
    image: metabase/metabase:v0.64.1
    depends_on:
      trino: {condition: service_healthy}
    ports: ["127.0.0.1:3002:3000"]
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase
      MB_SITE_URL: http://localhost:3002
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: -Xmx768m
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
    volumes:
      - metabase_data:/metabase-data
      - ./.secrets/trino-public:/tls:ro
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 60
      start_period: 120s
  # Identity provider (OIDC). Dev mode, realm imported from .secrets/keycloak/ on every start.
  # Browsers use localhost:8180; containers reach the same realm at keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    env_file: [.secrets/keycloak.env]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes: ["./.secrets/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8180:8080"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60
      start_period: 30s
  # Web page, sign-in and flight API (scripts/serve_bi_demo.py). Rebuilds the page from the v3 source on every start.
  bi-web:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN pip install --no-cache-dir trino==0.340.0 "pyjwt[crypto]==2.10.1"
        WORKDIR /app
    depends_on:
      trino: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    command: ["sh", "-c", "python scripts/build_bi_page.py && exec python -u scripts/serve_bi_demo.py"]
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8443"
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/qar/.well-known/openid-configuration
      BI_WEB_BIND: 0.0.0.0
    volumes:
      - ./scripts:/app/scripts:ro
      - ./bi/web:/app/bi/web
      - ./.secrets:/app/.secrets:ro
    ports: ["127.0.0.1:8766:8766"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8766/api/bi/health')"]
      interval: 5s
      retries: 12
volumes:
  rustfs_data:
  catalog_data:
  metabase_data:
